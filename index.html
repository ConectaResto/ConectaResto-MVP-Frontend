        .pt-4{padding-top:1.5rem!important}
        .d-flex{display:flex!important}

        .justify-content-between{justify-content:space-between!important}
        .align-items-center{align-items:center!important}
        .align-items-end{align-items:flex-end!important}

        .form-control{display:block;width:100%;padding:0.375rem 0.75rem;font-size:1rem;line-height:1.5;color:#212529;background-color:#fff;border:1px solid #ced4da;border-radius:0.25rem}

        .badge{display:inline-block;padding:0.35em 0.65em;font-size:0.75em;font-weight:700;line-height:1;color:#fff;border-radius:0.25rem}
        .alert{position:relative;padding:1rem 1rem;margin-bottom:1rem;border:1px solid transparent;border-radius:0.25rem}

        .nav{display:flex;flex-wrap:wrap;padding-left:0;margin-bottom:0;list-style:none}
        .nav-link{display:block;padding:0.5rem 1rem;color:#0d6efd;text-decoration:none}
        .nav-link.active{color:#fff;background-color:#0d6efd}
        .navbar{position:relative;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;padding:0.5rem 1rem}
        .navbar-brand{padding-top:0.3125rem;padding-bottom:0.3125rem;margin-right:1rem;font-size:1.25rem;text-decoration:none}
        .navbar-toggler{padding:0.25rem 0.75rem;font-size:1.25rem;line-height:1;background-color:transparent;border:1px solid transparent;border-radius:0.25rem}
.navbar-conectaresto{background-color:#163e32 !important}
.navbar-conectaresto .navbar-brand{color:#fff !important}
.navbar-conectaresto .navbar-toggler{border-color:rgba(255,255,255,0.5) !important}
        .navbar-conectaresto .navbar-toggler-icon{background-image:url("data:image/svg+xml;charset=utf8,%3Csvg viewBox='0 0 30 30' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath stroke='rgba%28255,255,255,1%29' stroke-width='2' stroke-linecap='round' stroke-miterlimit='10' d='M4 7h22M4 15h22M4 23h22'/%3E%3C/svg%3E") !important}
        #publicCartBtn,#publicCheckoutBtn,#publicCatalog button.btn-primary{background-color:#245c49 !important;border-color:#245c49 !important;color:#fff !important}
        #publicCartBtn:hover,#publicCheckoutBtn:hover,#publicCatalog button.btn-primary:hover{background-color:#1d4a3d !important;border-color:#1d4a3d !important}
        #publicCartBtn:focus,#publicCheckoutBtn:focus,#publicCatalog button.btn-primary:focus{box-shadow:0 0 0 0.2rem rgba(198,124,18,0.5) !important}
        #publicCartBtn:disabled,#publicCheckoutBtn:disabled,#publicCatalog button.btn-primary:disabled{background-color:#8b9e93 !important;border-color:#8b9e93 !important;color:#fff !important;opacity:1 !important;pointer-events:none !important}
        #publicCatalog button.btn-outline-secondary{color:#245c49 !important;border-color:#245c49 !important;background-color:transparent !important}
        #publicCatalog button.btn-outline-secondary:hover{background-color:#edf4ed !important;color:#1d4a3d !important;border-color:#1d4a3d !important}
        #publicCatalog button.btn-outline-secondary:focus{box-shadow:0 0 0 0.2rem rgba(198,124,18,0.5) !important}
        #publicCatalog button.btn-outline-secondary.active{background-color:#245c49 !important;border-color:#245c49 !important;color:#fff !important}
        #publicCatalog button.btn-outline-secondary:disabled{color:#8b9e93 !important;border-color:#8b9e93 !important;opacity:1 !important;pointer-events:none !important}
        body:has(#publicCatalog) footer{background-color:#163e32 !important}
        .collapse{display:none}
        .dropdown{position:relative}
        .fixed-top{position:fixed;top:0;right:0;left:0;z-index:1030}
        body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;margin:0;padding-top:70px}
        #flashContainer{position:fixed;top:70px;left:50%;transform:translateX(-50%);z-index:1060;width:100%;max-width:600px;pointer-events:none}
        .flash{pointer-events:auto;margin-bottom:1rem}

    <script>
        // Fallback: si Bootstrap JS no carga, proveer funcionalidad mínima de tab y modal
        window.addEventListener('load', function() {
            if (typeof bootstrap === 'undefined') {
                window.bootstrap = { Tab: function(el){ el.addEventListener('click',function(e){ e.preventDefault(); document.querySelectorAll('.tab-pane').forEach(function(p){p.classList.remove('show','active')}); document.querySelectorAll('.nav-link').forEach(function(l){l.classList.remove('active');l.setAttribute('aria-selected','false')}); el.classList.add('active');el.setAttribute('aria-selected','true'); var target=document.querySelector(el.getAttribute('data-bs-target'));if(target){target.classList.add('show','active')}} }) }, Modal: function(el){ var backdrop=document.createElement('div');backdrop.className='modal-backdrop fade show';document.body.appendChild(backdrop);el.style.display='block';el.classList.add('show');var closeBtn=el.querySelector('[data-bs-dismiss="modal"]');closeBtn&&closeBtn.addEventListener('click',function(){el.style.display='none';el.classList.remove('show');document.body.removeChild(backdrop)}) } };
            }
        });
    </script>
