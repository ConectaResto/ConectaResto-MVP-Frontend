<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="526" viewBox="0 0 960 526" role="img" aria-labelledby="title desc">
  <title id="title">C4 — Diagrama de contenedores</title>
  <desc id="desc">El navegador carga la SPA desde un servidor estático. La SPA llama a Flask por HTTP. Flask usa MySQL y el almacenamiento local de fotografías.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse">
      <path d="M 0 0 L 8 4 L 0 8 Z" fill="#334155"/>
    </marker>
  </defs>
  <style>
    text { font-family: Arial, sans-serif; fill: #1e293b; }
    .heading { fill: #1a3a5c; }
    .label { fill: #334155; }
    .edge { fill: none; stroke: #334155; stroke-width: 1.5; }
    .return { stroke-dasharray: 5 4; }
    .lifeline { stroke: #94a3b8; stroke-width: 1.2; stroke-dasharray: 5 4; }
  </style>
  <text x="480" y="34" text-anchor="middle" font-size="23" font-weight="700" class="heading">C4 — Diagrama de contenedores</text>
  <g>
<rect x="349" y="63" width="262" height="90" rx="8" fill="#e8f5e9" stroke="#4caf50" stroke-width="1.6"/>
<text x="480" y="93" text-anchor="middle" font-size="17" font-weight="700">Navegador web</text>
<text x="480" y="115" text-anchor="middle" font-size="14">Ejecuta la SPA</text>
<text x="480" y="135" text-anchor="middle" font-size="14">Navegación por hash</text>
</g>
  <path d="M 400 153 V 190 H 197 V 228" class="edge" marker-end="url(#arrow)"/>
  <text x="298" y="181" text-anchor="middle" font-size="14" class="label">HTTP · carga de archivos</text>
  <path d="M 560 153 V 190 H 762 V 228" class="edge" marker-end="url(#arrow)"/>
  <text x="660" y="181" text-anchor="middle" font-size="14" class="label">HTTP · solicitudes a la API</text>
  <g>
<rect x="42" y="228" width="310" height="118" rx="8" fill="#e8f5e9" stroke="#4caf50" stroke-width="1.6"/>
<text x="197" y="262" text-anchor="middle" font-size="17" font-weight="700">Servidor estático de la SPA</text>
<text x="197" y="284" text-anchor="middle" font-size="14">127.0.0.1:8000</text>
<text x="197" y="304" text-anchor="middle" font-size="14">HTML, CSS y JavaScript vanilla</text>
<text x="197" y="324" text-anchor="middle" font-size="14">Bootstrap local</text>
</g>
  <g>
<rect x="608" y="228" width="308" height="118" rx="8" fill="#fff3e0" stroke="#ff9800" stroke-width="1.6"/>
<text x="762" y="262" text-anchor="middle" font-size="17" font-weight="700">Backend Flask · API REST</text>
<text x="762" y="284" text-anchor="middle" font-size="14">127.0.0.1:5000</text>
<text x="762" y="304" text-anchor="middle" font-size="14">JSON, sesiones y CSRF</text>
<text x="762" y="324" text-anchor="middle" font-size="14">Generación de QR y fotos de productos</text>
</g>
  <path d="M 660 346 V 384 H 465 V 427" class="edge" marker-end="url(#arrow)"/>
  <text x="553" y="375" text-anchor="middle" font-size="14" class="label">SQLAlchemy / PyMySQL</text>
  <path d="M 812 346 V 427" class="edge" marker-end="url(#arrow)"/>
  <text x="819" y="393" text-anchor="start" font-size="13" class="label">Lectura y escritura</text>
  <g>
<rect x="330" y="427" width="270" height="76" rx="8" fill="#ffebee" stroke="#f44336" stroke-width="1.6"/>
<text x="465" y="460" text-anchor="middle" font-size="17" font-weight="700">MySQL 8</text>
<text x="465" y="482" text-anchor="middle" font-size="14">Datos de la aplicación</text>
</g>
  <g>
<rect x="682" y="427" width="250" height="76" rx="8" fill="#f3e5f5" stroke="#9c27b0" stroke-width="1.6"/>
<text x="807" y="460" text-anchor="middle" font-size="17" font-weight="700">Fotos de productos</text>
<text x="807" y="482" text-anchor="middle" font-size="14">instance/uploads/products/</text>
</g>
</svg>
