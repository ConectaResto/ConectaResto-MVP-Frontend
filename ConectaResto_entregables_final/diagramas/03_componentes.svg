<text x="480" y="508" text-anchor="middle" font-size="13">Base y registro ORM</text>
</g>
  <g>
<rect x="571" y="460" width="162" height="62" rx="8" fill="#eceff1" stroke="#607d8b" stroke-width="1.6"/>
<text x="652" y="486" text-anchor="middle" font-size="15" font-weight="700">config</text>
<text x="652" y="508" text-anchor="middle" font-size="13">Configuración</text>
