<text x="480" y="334.5" text-anchor="middle" font-size="17" font-weight="700">servicios</text>
<text x="480" y="356.5" text-anchor="middle" font-size="14">Apertura, pago simulado y cierre</text>
<text x="480" y="376.5" text-anchor="middle" font-size="14">servicios.repository</text>
<text x="480" y="396.5" text-anchor="middle" font-size="14">servicios.dto</text>
</g>
